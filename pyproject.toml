[project]
name = "hq-cli"
version = "0.1.0"
description = "CLI-first company OS for small teams -- Board and CRM from the terminal."
readme = "README.md"
authors = [
    { name = "Matti Ryttylainen", email = "matti.ryttylainen@gmail.com" }
]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "textual>=0.40.0",
    "sqlite-utils>=3.35",
    "pyfiglet>=1.0",
    "tomli-w>=1.0",
]

[project.scripts]
hq = "hq.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hq"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
